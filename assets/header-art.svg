<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Invia mist header art</title>
  <desc id="desc">A dark cliff and mist scene inspired by Invia E-Sports header imagery.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#121926"/>
      <stop offset="0.42" stop-color="#59616a"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eef1f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency="0.86" numOctaves="3" seed="12" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="url(#sky)"/>
  <path d="M0 320 130 160l130 44 160-96 160 232 130-86 150 58 150-222 170 82 110 202 210-118v244H0Z" fill="#17151a"/>
  <path d="M0 380 172 246l98 30 158-98 150 240 182-128 126 60 182-270 160 94 92 250 180-100v176H0Z" fill="#252326" opacity="0.82"/>
  <path d="M164 186c92 52 157 111 194 178M1107 88c-44 122-109 216-198 282M1268 180c-38 88-78 154-122 198" stroke="#6d737a" stroke-width="9" opacity="0.28"/>
  <g transform="translate(750 250) scale(0.74)" opacity="0.42">
    <path d="M0-110c-86 0-144 56-144 130 0 95 118 144 180 78 76-80 7-208-36-208Z" fill="#0b0b10" stroke="#d9dde6" stroke-opacity="0.2" stroke-width="18"/>
    <path d="M0-132c64 26 104 77 94 134-17 108-154 123-202 38-39-72 17-155 108-172Z" fill="none" stroke="#d9dde6" stroke-opacity="0.2" stroke-width="30"/>
    <path d="M-68 16c53 28 105 26 156-11M-360 42c136-14 221-65 286-174M360 42C224 28 139-23 74-132" fill="none" stroke="#d9dde6" stroke-opacity="0.2" stroke-width="42" stroke-linecap="round"/>
    <path d="M0 10 150 98 62 292h-124l-88-194Z" fill="none" stroke="#d9dde6" stroke-opacity="0.2" stroke-width="32" stroke-linejoin="round"/>
  </g>
  <g filter="url(#blur)" opacity="0.88">
    <ellipse cx="756" cy="376" rx="640" ry="78" fill="url(#mist)"/>
    <ellipse cx="320" cy="426" rx="420" ry="62" fill="#eff2f6" opacity="0.26"/>
    <ellipse cx="1130" cy="420" rx="440" ry="70" fill="#eff2f6" opacity="0.26"/>
  </g>
  <rect width="1500" height="500" fill="#000" opacity="0.18"/>
  <rect width="1500" height="500" filter="url(#grain)"/>
</svg>
